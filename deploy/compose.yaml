# Copied to the server by Jenkins. IMAGE/IMAGE_TAG come from release.env (written by Jenkins),
# database and storage settings from .env (created once on the server from .env.example).
# The database and object storage are the PostgreSQL and RustFS containers already running on the server.
services:
  app:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    # Public traffic comes through Traefik (HTTPS). 8080 is open on localhost only, for Jenkins' Verify stage.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - proxy
      - postgresql
      - rustfs
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.workout-api.rule: Host(`workout-api.jjoon.cloud`)
      traefik.http.routers.workout-api.entrypoints: websecure
      traefik.http.routers.workout-api.tls.certresolver: letsencrypt
      traefik.http.services.workout-api.loadbalancer.server.port: "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}

networks:
  # All three already exist on the server.
  proxy:
    external: true
  postgresql:
    external: true
  rustfs:
    external: true
